name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9.]+' tavoos-floating-call-button.php)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version $VERSION"
            exit 1
          fi

      - name: Build plugin zip
        run: git archive --format=zip --prefix=tavoos-floating-call-button/ -o tavoos-floating-call-button.zip HEAD

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Tavoos Floating Call Button v${{ steps.version.outputs.version }}
          make_latest: true
          files: tavoos-floating-call-button.zip
          body: |
            ## دکمه شناور تماس (Tavoos Floating Call Button) v${{ steps.version.outputs.version }}

            طراحی شده توسط [مهدی حبیبی | طاووس وب](https://tavoosweb.ir/)

            ### نصب
            1. فایل `tavoos-floating-call-button.zip` را دانلود کنید.
            2. در پیشخوان وردپرس به **افزونه‌ها ← افزودن ← بارگذاری افزونه** بروید و فایل را آپلود کنید.
            3. افزونه را فعال کنید و از منوی **دکمه تماس** تنظیمات را انجام دهید.

            آموزش تصویری کامل: [README](https://github.com/${{ github.repository }}#readme)
